name: Build portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "parser_local.py"
      - "requirements-local.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt pyinstaller

      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name TicoRuTrackerScraper --collect-all playwright --collect-all bs4 --collect-all pyee --collect-all greenlet parser_local.py

      - name: Add quick start instructions
        shell: pwsh
        run: |
          @'
          TICO RUTRACKER SCRAPER — WINDOWS

          1. Распакуй весь архив в обычную папку, например C:\TicoScraper.
          2. Убедись, что на компьютере установлен Google Chrome.
          3. Запусти TicoRuTrackerScraper.exe.
          4. В открывшемся окне Chrome войди в RuTracker и пройди проверку, если она появится.
          5. Вернись в консоль программы и нажми Enter.
          6. Готовый rutracker_retro_games_raw.json появится рядом с EXE.

          При следующем запуске программа использует сохранённый профиль в .rutracker-profile.
          Не удаляй эту папку, если хочешь сохранить вход. Не передавай её другим людям.
          Не запускай одновременно две копии программы с одним профилем.

          Python устанавливать не нужно. Google Chrome должен быть установлен отдельно.
          '@ | Set-Content -Path "dist/TicoRuTrackerScraper/ИНСТРУКЦИЯ.txt" -Encoding UTF8

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/TicoRuTrackerScraper" -DestinationPath "dist/TicoRuTrackerScraper-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicoRuTrackerScraper-Windows-x64
          path: dist/TicoRuTrackerScraper-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update portable Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Tico RuTracker Scraper — Windows
          body: |
            Portable Windows x64 build of the Tico RuTracker scraper.

            Python не требуется. Нужен установленный Google Chrome.
            Скачай ZIP, распакуй всю папку и запусти TicoRuTrackerScraper.exe.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/TicoRuTrackerScraper-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
