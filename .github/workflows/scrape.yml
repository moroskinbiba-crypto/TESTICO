name: Run RuTracker Scraper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "parser.py"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          BB_SESSION: ${{ secrets.BB_SESSION }}
          BB_GUID: ${{ secrets.BB_GUID }}
          BB_SSL: ${{ secrets.BB_SSL }}
          BB_T: ${{ secrets.BB_T }}
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}
        run: python parser.py

      - name: Commit and push changes if JSON updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rutracker_retro_games_raw.json
          git diff --cached --quiet || (git commit -m "Update retro games JSON database" && git push)
